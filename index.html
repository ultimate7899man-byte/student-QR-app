<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID QR Verification - Cyber</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #218838;
        }
        #resultSection {
            display: none;
            text-align: center;
        }
        .qr-box {
            margin: 20px 0;
        }
        .qr-box img {
            border: 5px solid #eaeaea;
            border-radius: 8px;
            padding: 5px;
            background: white;
        }
        .share-btn {
            display: inline-block;
            background-color: #25d366;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
        }
        .share-btn:hover {
            background-color: #1ebe5d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Student QR Registration</h2>
        
        <!-- Registration Form -->
        <form id="studentForm" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="uucms">UUCMS Number:</label>
                <input type="text" id="uucms" required placeholder="Enter 12-char UUCMS">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" maxlength="10" required placeholder="Enter 10-digit mobile number">
            </div>

            <div class="form-group">
                <label for="college">College Name:</label>
                <input type="text" id="college" required placeholder="Enter college name">
            </div>

            <div class="form-group">
                <label for="course">Course:</label>
                <select id="course" required>
                    <option value="">Select Course</option>
                    <option value="BCA">BCA</option>
                    <option value="B.Com">B.Com</option>
                    <option value="B.Sc">B.Sc</option>
                    <option value="BA">BA</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">Generate QR & Sync ⚡</button>
        </form>

        <!-- Result Section with QR Code -->
        <div id="resultSection">
            <h3>Registration Successful!</h3>
            <p>Your unique QR code has been generated.</p>
            <div class="qr-box">
                <img id="qrImage" src="" alt="Student QR Code">
            </div>
            <br>
            <a id="whatsappShareBtn" href="#" class="share-btn" target="_blank">Share via WhatsApp 📱</a>
        </div>
    </div>

    <script>
        // Google Apps Script Web App URL (सीधे Google Sheet में डेटा भेजने के लिए)
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlJGM0YY_Zi2wCrHoOT09dZxXe0vBfqdwj4Jaom-TjctqLO-RoPOkXJGYkFaN_mH8Q/exec";
        const LIVE_WEB_URL = "https://ultimate7899man-byte.github.io/student-QR-app/";

        let currentQRUrl = "";

        // सिर्फ नंबर इनपुट की अनुमति देने के लिए
        document.getElementById('phone').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        async function handleFormSubmit(event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const uucms = document.getElementById('uucms').value.trim().toUpperCase();
            const phone = document.getElementById('phone').value.trim();
            const college = document.getElementById('college').value.trim();
            const course = document.getElementById('course').value;
            const submitBtn = document.getElementById('submitBtn');

            if (uucms.length !== 12 || phone.length !== 10) {
                alert("Please enter a valid 12-character UUCMS and 10-digit Phone number!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Syncing with Sheet...";

            const payload = {
                name: name,
                uucms: uucms,
                phone: phone,
                college: college,
                course: course
            };

            try {
                // Google Apps Script को डेटा भेजना (no-cors मोड ताकि CORS की समस्या न आए)
                await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                // QR कोड जनरेट करने के लिए लिंक तैयार करना
                const qrLink = `${LIVE_WEB_URL}?name=${encodeURIComponent(name)}&uucms=${encodeURIComponent(uucms)}&phone=${encodeURIComponent(phone)}&college=${encodeURIComponent(college)}&course=${encodeURIComponent(course)}`;
                
                currentQRUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(qrLink)}`;
                document.getElementById('qrImage').src = currentQRUrl;

                const waText = `Student Details:\nName: ${name}\nUUCMS: ${uucms}\nPhone: ${phone}\nCourse: ${course}\nCollege: ${college}\n\nVerification Link:\n${qrLink}`;
                document.getElementById('whatsappShareBtn').href = `https://wa.me/?text=${encodeURIComponent(waText)}`;

                // फॉर्म छुपाकर क्यूआर कोड दिखाना
                document.getElementById('studentForm').style.display = "none";
                document.getElementById('resultSection').style.display = "block";

            } catch (err) {
                console.error(err);
                alert("Error connecting to server!");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Generate QR & Sync ⚡";
            }
        }
    </script>
</body>
</html>
